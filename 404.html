<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Ice Cold Analytics</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Archivo Narrow','Arial Narrow',Arial,sans-serif;background:#111d2e;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
    .wrap{padding:40px 24px;max-width:500px;}
    h1{font-family:'Cinzel',Georgia,serif;font-size:5rem;font-weight:700;color:#f0a500;line-height:1;margin-bottom:16px;}
    h2{font-family:'Cinzel',Georgia,serif;font-size:1.4rem;color:white;margin-bottom:16px;}
    p{color:rgba(255,255,255,0.6);font-size:15px;line-height:1.7;margin-bottom:32px;}
    a{display:inline-block;padding:14px 32px;background:#f0a500;color:#1a2e4a;font-family:'Archivo Narrow',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;border-radius:2px;}
    a:hover{background:#d99300;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has moved. Head back to the Ice Cold Analytics homepage.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
